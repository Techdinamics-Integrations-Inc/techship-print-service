# Built-in CUPS mode: the container runs its own CUPS (web UI on port 631) for USB/SMB/IPP printers.
# If the machine already runs CUPS, use docker-compose.remote-cups.yml instead.
services:
  print-service:
    image: ghcr.io/techdinamics-integrations-inc/techship-print-service:latest
    container_name: techship-print-service
    restart: unless-stopped
    ports:
      - "631:631"
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CUPS_USER=admin
      - CUPS_PASSWORD=change-me
    volumes:
      - ./config/appsettings.json:/app/config/appsettings.json:ro
      - cups-config:/etc/cups
      - cups-certs:/etc/cups/ssl
    privileged: true    # Often needed for USB printer access
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cups-config:
  cups-certs:
