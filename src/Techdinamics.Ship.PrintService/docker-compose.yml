version: '3.8'
services:
  print-service:
    build: .
    image: techship-print-service:latest
    container_name: techship-print-service
    restart: unless-stopped
    # network_mode: host
    ports:
      - "631:631"
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CUPS_USER=admin
      - CUPS_PASSWORD=admin
    volumes:
      - ./config/appsettings.json:/app/appsettings.json:ro
      - cups-config:/etc/cups
      - cups-certs:/etc/cups/ssl
    privileged: true    # Often needed for USB printer access
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cups-config:
  cups-certs:
